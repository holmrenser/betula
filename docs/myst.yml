version: 1
project:
  title: betula
  description: JSON Schemas for common bioinformatics data formats, with Python, TypeScript, and Rust bindings.
  github: https://github.com/holmrenser/betula
  license: MIT
  toc:
    - file: index.md
    # schemas.md and schemas/ are generated by scripts/generate_schema_pages.py
    - file: schemas.md
      children:
        - pattern: schemas/*.md
        - title: Core primitives
          children:
            - pattern: schemas/core/*.md
site:
  template: book-theme
  options:
    logo_text: betula
